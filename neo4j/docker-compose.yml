services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"   # Porta da interface web (Browser)
      - "7687:7687"   # Porta do protocolo Bolt
    environment:
      - NEO4J_AUTH=neo4j/test123dwkopfkwfpokwefw  # Usuário e senha padrão
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
